        :root { --blue:#00529F; --light:#4DA9FF; --text:#1a1a1a; --muted:#6b7280; --bg:#f9fafb; --ease-out:cubic-bezier(0.23,1,0.32,1); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); }

        /* BANNER */
        #page-banner { position:relative; height:400px; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
        #banner-bg { position:absolute; inset:0; background-image:url('https://www.idom.com/wp-content/uploads/2024/04/IDOM_Nueva-Romareda_render_exterior_dia_plaza-1920x1080.jpg'); background-size:cover; background-position:center; opacity:1; }
        #banner-overlay { position:absolute; inset:0; background:linear-gradient(160deg,rgba(0,30,80,.55) 0%,rgba(0,0,0,.75) 100%); }

        #banner-content h1 { font-size:clamp(1.8rem,4vw,3rem); font-weight:900; color:white; margin-bottom:.75rem; letter-spacing:-0.03em; line-height:1.05; text-wrap:balance; }
        #banner-content p { font-size:1.05rem; color:rgba(255,255,255,.75); max-width:600px; margin:0 auto; line-height:1.6; }
        .banner-badge { display:inline-block; background:rgba(255,255,255,.15); border:0.5px solid rgba(255,255,255,.3); color:white; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; padding:5px 16px; border-radius:100px; margin-bottom:1rem; }

        /* DATOS TÉCNICOS */
        .datos-section { background:white; padding:4rem 10%; }
        .datos-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:20px; max-width:900px; margin:2rem auto 0; }

        .dato-num { font-size:1.8rem; font-weight:900; color:var(--blue); display:block; margin-bottom:4px; letter-spacing:-0.02em; }
        .dato-label { font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }

        /* SECCIONES */
        .section-title { font-size:clamp(1.6rem,3vw,2.2rem); font-weight:900; text-align:center; color:var(--blue); margin-bottom:.75rem; letter-spacing:-0.02em; text-wrap:balance; }
        .section-subtitle { text-align:center; color:var(--muted); margin-bottom:3rem; font-size:1rem; }
        .secciones-section { padding:4rem 10%; background:var(--bg); }
        .seccion-block { margin-bottom:3rem; }
        .seccion-block h3 { font-size:1.1rem; font-weight:700; color:var(--blue); margin-bottom:1rem; display:flex; align-items:center; gap:8px; }
        .renders-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
        .render-item { background:white; padding:12px; border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.06); cursor:pointer; transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out); }
        @media (hover:hover) and (pointer:fine) { .render-item:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(0,0,0,.1); } }
        .render-item:active { transform:scale(0.98); }
        .render-item img { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:8px; display:block; }
        .render-item .caption { margin-top:8px; color:var(--blue); font-weight:700; font-size:.85rem; text-align:center; }

        /* COMPARADOR */
        .comparador-section { padding:4rem 10%; background:white; }
        .comparison-wrapper { position:relative; width:100%; max-width:900px; margin:0 auto; border-radius:15px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); }
        .img-comp-container { position:relative; height:500px; overflow:hidden; }
        .img-comp-img { position:absolute; width:auto; height:100%; overflow:hidden; }
        .img-comp-img img { display:block; height:100%; width:auto; }
        .img-comp-slider { position:absolute; z-index:9; cursor:ew-resize; width:40px; height:40px; background:var(--light); border:3px solid white; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px rgba(0,0,0,.5); }
        .img-comp-overlay-label { position:absolute; bottom:20px; background:rgba(0,0,0,.5); color:white; padding:5px 15px; border-radius:20px; font-size:.9rem; pointer-events:none; }

        /* LIGHTBOX */
        #lb-overlay { display:none !important; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.96); align-items:center; justify-content:center; flex-direction:column; overscroll-behavior:contain; }
        #lb-overlay.active { display:flex !important; }
        #lb-img { max-width:90vw; max-height:85vh; object-fit:contain; border-radius:4px; }
        #lb-caption { color:rgba(255,255,255,.5); font-size:.85rem; margin-top:12px; }

        button, a, [role="button"] { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
        h1,h2,h3,h4,.section-title,#banner-content h1 { text-wrap:balance; }

    <script>
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mainNav = document.getElementById('mainNav');
        hamburgerBtn.addEventListener('click', function() {
            const isOpen = mainNav.classList.toggle('open');
            hamburgerBtn.classList.toggle('open', isOpen);
            hamburgerBtn.setAttribute('aria-expanded', isOpen);
        });
        mainNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
            mainNav.classList.remove('open');
            hamburgerBtn.classList.remove('open');
            hamburgerBtn.setAttribute('aria-expanded', false);
        }));
    </script>
