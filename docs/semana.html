<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana · Obras Romareda</title>
    <meta name="description" content="Crónica semanal de las obras de la nueva Romareda">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --blue:#00529F; --light:#4DA9FF; --text:#1a1a1a; --muted:#6b7280; --bg:#f9fafb; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); }

        .top-bar {
            background:var(--blue); padding:14px 5%;
            display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:100;
            box-shadow:0 4px 15px rgba(0,0,0,.2);
        }
        .top-bar-logo {
            font-family:'Calibri','Segoe UI',sans-serif;
            font-weight:700; font-style:italic;
            font-size:1.4rem; color:white; text-decoration:none;
        }
        .top-bar-logo:hover { color:var(--light); }
        .back-link {
            display:flex; align-items:center; gap:8px;
            color:rgba(255,255,255,.7); font-size:.9rem;
            text-decoration:none; transition:color .2s;
        }
        .back-link:hover { color:white; }

        .week-hero { background:var(--blue); padding:3rem 10% 2.5rem; color:white; }
        .week-badge {
            display:inline-block; background:rgba(255,255,255,.15);
            border:1px solid rgba(255,255,255,.3); color:white;
            font-size:.8rem; font-weight:700; text-transform:uppercase;
            letter-spacing:1.5px; padding:5px 14px; border-radius:20px; margin-bottom:16px;
        }
        .week-title { font-size:2.5rem; font-weight:900; color:white; line-height:1.2; margin-bottom:12px; }
        .week-meta { font-size:.9rem; color:rgba(255,255,255,.6); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .week-meta span { display:flex; align-items:center; gap:6px; }

        .week-content { max-width:900px; margin:0 auto; padding:3rem 5%; }

        .week-video-section { margin-bottom:3rem; }
        .week-video-section h2 {
            font-size:1.3rem; font-weight:700; color:var(--blue);
            margin-bottom:1rem; display:flex; align-items:center; gap:10px;
        }
        .video-wrapper {
            position:relative; padding-bottom:56.25%; height:0;
            overflow:hidden; border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,.12);
        }
        .video-wrapper iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }

        .week-photos-section { margin-bottom:3rem; }
        .week-photos-section h2 {
            font-size:1.3rem; font-weight:700; color:var(--blue);
            margin-bottom:1rem; display:flex; align-items:center; gap:10px;
        }
        .photos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
        .photo-item { border-radius:10px; overflow:hidden; aspect-ratio:4/3; cursor:pointer; background:var(--bg); }
        .photo-item img { width:100%; height:100%; object-fit:cover; transition:transform .3s; display:block; }
        .photo-item:hover img { transform:scale(1.05); }

        .week-nav { display:flex; gap:12px; border-top:1px solid #e5e7eb; padding-top:2rem; margin-top:1rem; }
        .week-nav-btn {
            flex:1; padding:14px; background:white; border:1px solid #e5e7eb;
            border-radius:12px; cursor:pointer; font-family:'Inter',sans-serif;
            transition:all .2s; text-decoration:none; display:flex; align-items:center; gap:10px;
        }
        .week-nav-btn:hover { border-color:var(--blue); background:rgba(0,82,159,.04); }
        .week-nav-btn.prev { justify-content:flex-start; }
        .week-nav-btn.next { justify-content:flex-end; text-align:right; }
        .week-nav-label { font-size:.75rem; color:var(--muted); display:block; }
        .week-nav-name  { font-size:.9rem; font-weight:700; color:var(--blue); display:block; }

        /* LIGHTBOX */
        #lightbox {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,.95); z-index:2000;
            align-items:center; justify-content:center; flex-direction:column;
        }
        #lightbox img { max-width:90vw; max-height:85vh; object-fit:contain; border-radius:4px; }
        #lightbox-close {
            position:absolute; top:20px; right:28px;
            color:white; font-size:2.5rem; cursor:pointer; background:none; border:none; line-height:1;
        }
        #lightbox-prev, #lightbox-next {
            position:absolute; top:50%; transform:translateY(-50%);
            color:white; font-size:2rem; cursor:pointer;
            background:rgba(0,0,0,.4); border:none; padding:16px 14px; transition:background .2s;
        }
        #lightbox-prev { left:0; border-radius:0 4px 4px 0; }
        #lightbox-next { right:0; border-radius:4px 0 0 4px; }
        #lightbox-prev:hover, #lightbox-next:hover { background:rgba(0,0,0,.8); }
        #lightbox-caption { color:rgba(255,255,255,.6); font-size:.85rem; margin-top:12px; }

        /* COMPARTIR */
        .share-btn {
            display:flex; align-items:center; gap:8px;
            background:rgba(255,255,255,.15);
            border:1px solid rgba(255,255,255,.3);
            color:white; padding:8px 16px; border-radius:30px;
            font-size:.85rem; font-weight:600;
            cursor:pointer; font-family:'Inter',sans-serif;
            transition:all .2s;
        }
        .share-btn:hover { background:rgba(255,255,255,.25); }

        .share-menu {
            position:fixed; inset:0; z-index:3000;
            display:none; align-items:flex-end; justify-content:center;
            background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
        }
        .share-menu.open { display:flex; }
        .share-sheet {
            background:#1a1a2e; border-radius:24px 24px 0 0;
            padding:2rem; width:100%; max-width:480px;
            animation:slideUp .3s ease;
        }
        @keyframes slideUp {
            from { transform:translateY(100%); opacity:0; }
            to   { transform:translateY(0);    opacity:1; }
        }
        .share-sheet h3 {
            font-size:1rem; font-weight:700; color:white;
            margin-bottom:.5rem; text-align:center;
        }
        .share-sheet p {
            font-size:.82rem; color:rgba(255,255,255,.5);
            text-align:center; margin-bottom:1.5rem;
        }
        .share-options {
            display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
            margin-bottom:1.25rem;
        }
        .share-option {
            display:flex; flex-direction:column; align-items:center; gap:8px;
            cursor:pointer; transition:transform .2s;
        }
        .share-option:hover { transform:translateY(-3px); }
        .share-option-icon {
            width:52px; height:52px; border-radius:14px;
            display:flex; align-items:center; justify-content:center;
            font-size:1.4rem;
        }
        .share-option span {
            font-size:.72rem; color:rgba(255,255,255,.6); font-weight:600;
        }
        .share-copy-row {
            display:flex; gap:8px; margin-bottom:1.25rem;
        }
        .share-url {
            flex:1; padding:10px 14px; background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15); border-radius:10px;
            color:rgba(255,255,255,.7); font-size:.8rem;
            font-family:'Inter',sans-serif; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap;
        }
        .share-copy-btn {
            padding:10px 16px; background:var(--blue);
            border:none; border-radius:10px; color:white;
            font-size:.82rem; font-weight:700;
            cursor:pointer; font-family:'Inter',sans-serif;
            transition:background .2s; white-space:nowrap;
        }
        .share-copy-btn:hover { background:#0063bf; }
        .share-close {
            width:100%; padding:12px; background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15); border-radius:12px;
            color:rgba(255,255,255,.7); font-size:.9rem; font-weight:600;
            cursor:pointer; font-family:'Inter',sans-serif; transition:all .2s;
        }
        .share-close:hover { background:rgba(255,255,255,.15); }
            background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
            background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        @media(max-width:768px){
            .week-title { font-size:1.8rem; }
            .week-content { padding:2rem 5%; }
            .photos-grid { grid-template-columns:repeat(2,1fr); }
            .week-nav { flex-direction:column; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="top-bar-logo">@ObrasRomareda</a>
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
        <button class="share-btn" onclick="openShare()">
            <i class="fas fa-share-alt"></i> Compartir
        </button>
    </div>

    <div class="week-hero">
        <div id="hero-badge" class="week-badge">Cargando...</div>
        <h1 id="hero-title" class="week-title">Cargando semana...</h1>
        <div class="week-meta">
            <span><i class="fas fa-calendar"></i> <span id="hero-date"></span></span>
            <span><i class="fas fa-images"></i> <span id="hero-photos">0 fotos</span></span>
        </div>
    </div>

    <div class="week-content">
        <div class="week-video-section" id="week-video-section" style="display:none;">
            <h2><i class="fas fa-play-circle" style="color:var(--light);"></i> Vídeo de la semana</h2>
            <div class="video-wrapper">
                <iframe id="week-video-iframe" src="" title="Vídeo semanal" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>

        <div class="week-photos-section">
            <h2><i class="fas fa-camera" style="color:var(--light);"></i> Fotos <span id="photos-count"></span></h2>
            <div class="photos-grid" id="photos-grid">
                <div class="skeleton" style="aspect-ratio:4/3;"></div>
                <div class="skeleton" style="aspect-ratio:4/3;"></div>
                <div class="skeleton" style="aspect-ratio:4/3;"></div>
                <div class="skeleton" style="aspect-ratio:4/3;"></div>
            </div>
        </div>

        <div class="week-nav">
            <a id="nav-prev" class="week-nav-btn prev" href="#">
                <i class="fas fa-chevron-left" style="color:var(--muted);"></i>
                <div>
                    <span class="week-nav-label">Semana anterior</span>
                    <span class="week-nav-name" id="nav-prev-label">—</span>
                </div>
            </a>
            <a id="nav-next" class="week-nav-btn next" href="#">
                <div>
                    <span class="week-nav-label">Semana siguiente</span>
                    <span class="week-nav-name" id="nav-next-label">—</span>
                </div>
                <i class="fas fa-chevron-right" style="color:var(--muted);"></i>
            </a>
        </div>
    </div>

    <!-- COMPARTIR -->
    <div class="share-menu" id="share-menu" onclick="closeShare(event)">
        <div class="share-sheet">
            <h3>Compartir Semana <span id="share-week-num"></span></h3>
            <p id="share-subtitle">Obras Romareda · Seguimiento semanal</p>

            <div class="share-options">
                <div class="share-option" onclick="shareWhatsApp()">
                    <div class="share-option-icon" style="background:#25D366;">
                        <i class="fab fa-whatsapp" style="color:white;"></i>
                    </div>
                    <span>WhatsApp</span>
                </div>
                <div class="share-option" onclick="shareTwitter()">
                    <div class="share-option-icon" style="background:#000;">
                        <i class="fab fa-x-twitter" style="color:white;"></i>
                    </div>
                    <span>X / Twitter</span>
                </div>
                <div class="share-option" onclick="shareTelegram()">
                    <div class="share-option-icon" style="background:#229ED9;">
                        <i class="fab fa-telegram" style="color:white;"></i>
                    </div>
                    <span>Telegram</span>
                </div>
                <div class="share-option" onclick="shareNative()">
                    <div class="share-option-icon" style="background:#374151;">
                        <i class="fas fa-ellipsis" style="color:white;"></i>
                    </div>
                    <span>Más</span>
                </div>
            </div>

            <div class="share-copy-row">
                <div class="share-url" id="share-url-display"></div>
                <button class="share-copy-btn" id="share-copy-btn" onclick="copyUrl()">
                    <i class="fas fa-copy"></i> Copiar
                </button>
            </div>

            <button class="share-close" onclick="closeShare()">Cancelar</button>
        </div>
    </div>

    <!-- LIGHTBOX -->
        <button id="lightbox-close" onclick="closeLightbox()">×</button>
        <button id="lightbox-prev" onclick="changeLightbox(-1)">&#10094;</button>
        <img id="lightbox-img" src="" alt="">
        <div id="lightbox-caption"></div>
        <button id="lightbox-next" onclick="changeLightbox(1)">&#10095;</button>
    </div>

    <script>
        const SUPABASE_URL  = 'https://vakpbedvlvxzybxqival.supabase.co';
        const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZha3BiZWR2bHZ4enlieHFpdmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDUzNDEsImV4cCI6MjEwMjUyMTM0MX0.fCZyl9nMGrqtNEHSLx8pZEeFPL4jzzzSKKHtTYQqrw0';
        const BUCKET        = 'fotos';
        const sb            = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const OBRAS_START = new Date('2024-07-08T00:00:00');

        function getWeekDates(weekNum) {
            const start = new Date(OBRAS_START);
            start.setDate(start.getDate() + (weekNum - 1) * 7);
            const end = new Date(start);
            end.setDate(end.getDate() + 6);
            const fmt = (d) => d.toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
            return { start: fmt(start), end: fmt(end) };
        }

        // Leer número de semana del parámetro ?n=86
        const params   = new URLSearchParams(window.location.search);
        const WEEK_NUM = parseInt(params.get('n')) || 1;

        let lightboxPhotos = [];
        let lightboxIndex  = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            document.title = `Semana ${WEEK_NUM} · Obras Romareda`;

            const [meta, photos] = await Promise.all([loadMeta(), loadPhotos()]);

            renderHero(meta, photos.length);
            renderVideo(meta);
            renderPhotos(photos);
            renderNav();
        });

        async function loadMeta() {
            const { data } = await sb
                .from('semanas')
                .select('*')
                .eq('numero', WEEK_NUM)
                .single();
            return data || {};
        }

        async function loadPhotos() {
            const { data, error } = await sb.storage
                .from(BUCKET)
                .list(`semana-${WEEK_NUM}`, { sortBy: { column: 'created_at', order: 'asc' } });
            if (error || !data) return [];
            return data.filter(f => f.name !== '.emptyFolderPlaceholder');
        }

        function getPublicUrl(filename) {
            const { data } = sb.storage.from(BUCKET).getPublicUrl(`semana-${WEEK_NUM}/${filename}`);
            return data.publicUrl;
        }

        function renderHero(meta, photoCount) {
            const dates = getWeekDates(WEEK_NUM);
            document.getElementById('hero-badge').textContent  = `Semana ${WEEK_NUM}`;
            document.getElementById('hero-title').textContent  = meta.title || `Semana ${WEEK_NUM}`;
            document.getElementById('hero-date').textContent   = `${dates.start} – ${dates.end}`;
            document.getElementById('hero-photos').textContent = `${photoCount} fotos`;
        }

        function renderVideo(meta) {
            if (!meta.video_id) return;
            const section = document.getElementById('week-video-section');
            document.getElementById('week-video-iframe').src = `https://www.youtube.com/embed/${meta.video_id}`;
            section.style.display = 'block';
        }

        function renderPhotos(files) {
            const grid  = document.getElementById('photos-grid');
            const count = document.getElementById('photos-count');
            count.textContent = `(${files.length})`;
            lightboxPhotos = files;

            if (files.length === 0) {
                grid.innerHTML = '<p style="color:var(--muted); grid-column:1/-1;">Aún no hay fotos en esta semana.</p>';
                return;
            }

            grid.innerHTML = files.map((f, idx) => {
                const url = getPublicUrl(f.name);
                return `
                    <div class="photo-item" onclick="openLightbox(${idx})">
                        <img src="${url}" alt="Semana ${WEEK_NUM} foto ${idx+1}" loading="lazy">
                    </div>`;
            }).join('');
        }

        async function renderNav() {
            const prev = document.getElementById('nav-prev');
            const next = document.getElementById('nav-next');

            // Comprobar si existen semanas adyacentes en BD
            const { data: prevData } = await sb.from('semanas').select('numero').eq('numero', WEEK_NUM - 1).single();
            const { data: nextData } = await sb.from('semanas').select('numero').eq('numero', WEEK_NUM + 1).single();

            if (prevData) {
                prev.href = `semana.html?n=${WEEK_NUM - 1}`;
                document.getElementById('nav-prev-label').textContent = `Semana ${WEEK_NUM - 1}`;
            } else {
                prev.style.opacity = '.3'; prev.style.pointerEvents = 'none';
            }

            if (nextData) {
                next.href = `semana.html?n=${WEEK_NUM + 1}`;
                document.getElementById('nav-next-label').textContent = `Semana ${WEEK_NUM + 1}`;
            } else {
                next.style.opacity = '.3'; next.style.pointerEvents = 'none';
            }
        }

        function openLightbox(idx) {
            lightboxIndex = idx;
            showLightboxPhoto();
            document.getElementById('lightbox').style.display = 'flex';
        }
        function showLightboxPhoto() {
            const url = getPublicUrl(lightboxPhotos[lightboxIndex].name);
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-caption').textContent =
                `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
        }
        function changeLightbox(dir) {
            lightboxIndex = (lightboxIndex + dir + lightboxPhotos.length) % lightboxPhotos.length;
            showLightboxPhoto();
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-img').src = '';
        }
        document.addEventListener('keydown', e => {
            const lb = document.getElementById('lightbox');
            if (lb.style.display !== 'flex') return;
            if (e.key === 'ArrowLeft')  changeLightbox(-1);
            if (e.key === 'ArrowRight') changeLightbox(1);
            if (e.key === 'Escape')     closeLightbox();
        });
        // ============================================
        // COMPARTIR
        // ============================================
        function getShareData() {
            const url  = window.location.href;
            const text = `🏗️ Obras Romareda · Semana ${WEEK_NUM} — Sigue el avance de las obras de la nueva Romareda`;
            return { url, text };
        }

        function openShare() {
            const { url } = getShareData();
            document.getElementById('share-week-num').textContent = WEEK_NUM;
            document.getElementById('share-url-display').textContent = url;
            document.getElementById('share-menu').classList.add('open');
        }

        function closeShare(e) {
            if (!e || e.target === document.getElementById('share-menu')) {
                document.getElementById('share-menu').classList.remove('open');
            }
        }

        function shareWhatsApp() {
            const { url, text } = getShareData();
            window.open(`https://wa.me/?text=${encodeURIComponent(text + '\n' + url)}`, '_blank');
        }

        function shareTwitter() {
            const { url, text } = getShareData();
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}&via=ObrasRomareda`, '_blank');
        }

        function shareTelegram() {
            const { url, text } = getShareData();
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
        }

        async function shareNative() {
            const { url, text } = getShareData();
            if (navigator.share) {
                try {
                    await navigator.share({ title: `Obras Romareda · Semana ${WEEK_NUM}`, text, url });
                } catch(e) {}
            } else {
                copyUrl();
            }
        }

        async function copyUrl() {
            const { url } = getShareData();
            const btn = document.getElementById('share-copy-btn');
            try {
                await navigator.clipboard.writeText(url);
                btn.innerHTML = '<i class="fas fa-check"></i> Copiado';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i> Copiar';
                    btn.style.background = '';
                }, 2000);
            } catch(e) {
                btn.textContent = 'Error';
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeShare();
        });

        document.getElementById('lightbox').addEventListener('click', e => {
            if (e.target === document.getElementById('lightbox')) closeLightbox();
        });
    </script>
</body>
</html>
