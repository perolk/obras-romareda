<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00529F">
    <title>La Vieja Romareda · Obras Romareda</title>
    <meta name="description" content="Archivo fotográfico de La Vieja Romareda. 67 años de historia, pasión y recuerdos blanquiazules.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html { scrollbar-gutter: stable; }
        h1, h2, h3, #banner-title { font-optical-sizing: auto; }
        @media (prefers-reduced-transparency: reduce) {
            #banner-overlay { background: rgba(0,20,70,.85); backdrop-filter: none; }
        }
        :root {
            --blue: #00529F;
            --light: #4DA9FF;
            --text: #1a1a1a;
            --muted: #6b7280;
            --bg: #f9fafb;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); }

        /* BANNER — idéntico al de proyecto */
        #page-banner {
            position: relative;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        #banner-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
        }
        #banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(0,30,80,.55) 0%, rgba(0,0,0,.75) 100%);
        }
        #banner-content {
            position: relative;
            z-index: 2;
            color: white;
            padding: 0 10%;
        }
        .banner-badge {
            display: inline-block;
            background: rgba(255,255,255,.15);
            border: 0.5px solid rgba(255,255,255,.3);
            color: white;
            font-size: .78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            padding: 5px 16px;
            border-radius: 100px;
            margin-bottom: 1rem;
        }
        #banner-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 900;
            color: white;
            margin-bottom: .75rem;
            letter-spacing: -0.03em;
            line-height: 1.05;
            text-wrap: balance;
        }
        #banner-subtitle {
            font-size: 1.05rem;
            color: rgba(255,255,255,.75);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* GALERÍA */
        .gallery-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 5%;
        }
        .gallery-filters {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }
        .gallery-count {
            font-size: .85rem;
            color: var(--muted);
            font-weight: 500;
        }
        .masonry {
            columns: 4 240px;
            column-gap: 12px;
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        @keyframes fadeUpItem {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .masonry-item { will-change: transform; }
        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform 220ms var(--ease-out);
        }
        @media (hover: hover) and (pointer: fine) {
            .masonry-item:hover img { transform: scale(1.04); }
        }
        .masonry-item .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,.6), transparent 50%);
            opacity: 0;
            transition: opacity 200ms var(--ease-out);
            display: flex;
            align-items: flex-end;
            padding: 12px;
            color: white;
            font-size: .78rem;
            font-weight: 500;
        }
        @media (hover: hover) and (pointer: fine) {
            .masonry-item:hover .overlay { opacity: 1; }
        }
        
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .load-more-wrap { text-align: center; margin-top: 2rem; }
        .load-more-btn {
            padding: 12px 32px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 100px;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
        }
        @media (hover: hover) and (pointer: fine) {
            .load-more-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,82,159,.3); }
        }
        .load-more-btn:active { transform: scale(0.97); }

        /* LIGHTBOX */
        #lb-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,.96);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overscroll-behavior: contain;
        }
        #lb-overlay.active { display: flex; }
        #lb-close {
            position: fixed;
            top: 20px;
            right: 28px;
            color: white;
            font-size: 2.5rem;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
        }
        #lb-prev:active, #lb-next:active { transform: translateY(-50%) scale(0.9); transition-duration: 80ms; }
        #lb-prev, #lb-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 2rem;
            background: rgba(255,255,255,.1);
            border: none;
            padding: 16px 14px;
            cursor: pointer;
        }
        #lb-prev { left: 0; border-radius: 0 6px 6px 0; }
        #lb-next { right: 0; border-radius: 6px 0 0 6px; }
        #lb-img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
        #lb-caption { color: rgba(255,255,255,.5); font-size: .85rem; margin-top: 12px; }

        /* FAB */
        .share-fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--blue);
            color: white;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,82,159,.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
            z-index: 100;
        }
        @media (hover: hover) and (pointer: fine) {
            .share-fab:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,82,159,.5); }
        }
        .share-fab:active { transform: scale(0.95); }

        /* FOOTER */
        footer { background: var(--blue); color: white; padding: 3rem 10%; text-align: center; border-top: 6px solid var(--light); }

        button, a, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3 { text-wrap: balance; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
        @media (max-width: 768px) {
            #page-banner { height: 300px; }
            .masonry { columns: 2 150px; }
        }
    </style>
</head>
<body>

    <!-- BANNER -->
    <div id="page-banner">
        <div id="banner-bg" style="background-image:url('https://www.heraldo.es/uploads/imagenes/2019/08/28/_P924010_f6390c26.jpg');"></div>
        <div id="banner-overlay"></div>
        <div id="banner-content">
            <div class="banner-badge">1957 – 2024</div>
            <h1 id="banner-title">La Vieja Romareda</h1>
            <p id="banner-subtitle">67 años de historia, pasión y recuerdos blanquiazules.</p>
        </div>
    </div>

    <!-- GALERÍA -->
    <div class="gallery-section">
        <div class="gallery-filters">
            <span style="font-size:1rem; font-weight:700; color:var(--blue);">
                <i class="fas fa-images" style="margin-right:6px;" aria-hidden="true"></i>Archivo fotográfico
            </span>
            <span class="gallery-count" id="gallery-count"></span>
        </div>
        <div class="masonry" id="masonry">
            <div class="masonry-skeleton" style="height:220px;"></div>
            <div class="masonry-skeleton" style="height:160px;"></div>
            <div class="masonry-skeleton" style="height:280px;"></div>
            <div class="masonry-skeleton" style="height:200px;"></div>
            <div class="masonry-skeleton" style="height:180px;"></div>
            <div class="masonry-skeleton" style="height:240px;"></div>
        </div>
        <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
            <button class="load-more-btn" id="load-more-btn" onclick="loadMore()">
                <i class="fas fa-chevron-down" aria-hidden="true"></i> Cargar más fotos
            </button>
        </div>
    </div>

    <footer>
        <a href="index.html" style="font-family:'Calibri','Segoe UI',sans-serif;font-weight:700;font-style:italic;font-size:1.8rem;color:white;text-decoration:none;">@ObrasRomareda</a>
        <p style="color:rgba(255,255,255,.6);font-size:.85rem;margin-top:1rem;">Web no oficial · Fotografías históricas de La Vieja Romareda</p>
    </footer>

    <!-- LIGHTBOX -->
    <div id="lb-overlay" onclick="if(event.target===this)lbClose()">
        <button id="lb-close" onclick="lbClose()" aria-label="Cerrar">&#x2715;</button>
        <button id="lb-prev" onclick="lbChange(-1)" aria-label="Anterior">&#10094;</button>
        <img id="lb-img" src="" alt="">
        <div id="lb-caption"></div>
        <button id="lb-next" onclick="lbChange(1)" aria-label="Siguiente">&#10095;</button>
    </div>

    <!-- FAB -->
    <button class="share-fab" onclick="shareHistoria()" title="Compartir" aria-label="Compartir">
        <i class="fas fa-share-alt" aria-hidden="true"></i>
    </button>

    <script>
        const SUPABASE_URL = 'https://vakpbedvlvxzybxqival.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZha3BiZWR2bHZ4enlieHFpdmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDUzNDEsImV4cCI6MjEwMjUyMTM0MX0.fCZyl9nMGrqtNEHSLx8pZEeFPL4jzzzSKKHtTYQqrw0';
        const BUCKET    = 'historia';
        const PAGE_SIZE = 24;
        const sb        = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allFiles = [], shown = 0;
        let lbPhotos = [], lbIdx = 0;

        // BANNER
        async function loadBanner() {
            try {
                const { data } = await sb.from('banners').select('*').eq('pagina','historia').limit(1);
                const row = data && data[0];
                if (!row) return;
                if (row.foto_url) document.getElementById('banner-bg').style.backgroundImage = `url('${row.foto_url}')`;
                if (row.titulo)   document.getElementById('banner-title').textContent   = row.titulo;
                if (row.subtexto) document.getElementById('banner-subtitle').textContent = row.subtexto;
            } catch(e) {}
        }

        // FOTOS
        async function loadPhotos() {
            const { data, error } = await sb.storage.from(BUCKET).list('', { limit:1000, sortBy:{ column:'created_at', order:'desc' } });
            if (error || !data) {
                document.getElementById('masonry').innerHTML = '<p style="color:var(--muted);text-align:center;padding:2rem;">No hay fotos todavía.</p>';
                return;
            }
            allFiles = data.filter(f => f.name !== '.emptyFolderPlaceholder');
            const countEl = document.getElementById('gallery-count');
            if (countEl) countEl.textContent = `${allFiles.length} foto${allFiles.length !== 1 ? 's' : ''}`;
            document.getElementById('masonry').innerHTML = '';
            shown = 0;
            renderBatch();
        }

        function getUrl(name) {
            return sb.storage.from(BUCKET).getPublicUrl(name).data.publicUrl;
        }

        function renderBatch() {
            const masonry = document.getElementById('masonry');
            const batch   = allFiles.slice(shown, shown + PAGE_SIZE);
            batch.forEach((f, i) => {
                const url  = getUrl(f.name);
                const idx  = shown + i;
                const item = document.createElement('div');
                item.className  = 'masonry-item';
                item.setAttribute('role', 'button');
                item.setAttribute('tabindex', '0');
                item.style.animation = `fadeUpItem 300ms var(--ease-out) ${i * 30}ms both`;
                item.onclick = () => lbOpen(allFiles.map(f => getUrl(f.name)), idx);
                item.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') lbOpen(allFiles.map(f => getUrl(f.name)), idx); };
                item.innerHTML = `
                    <img src="${url}" alt="La Vieja Romareda" loading="${idx < 8 ? 'eager' : 'lazy'}">
                    <div class="overlay"><span>${f.name.replace(/^\d+_/, '').replace(/\.[^.]+$/, '')}</span></div>`;
                masonry.appendChild(item);
            });
            shown += batch.length;
            const wrap = document.getElementById('load-more-wrap');
            const btn  = document.getElementById('load-more-btn');
            if (shown < allFiles.length) {
                wrap.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-chevron-down" aria-hidden="true"></i> Cargar más (${allFiles.length - shown} restantes)`;
            } else {
                wrap.style.display = 'none';
            }
        }

        function loadMore() {
            document.getElementById('load-more-btn').disabled = true;
            renderBatch();
        }

        // LIGHTBOX
        function lbOpen(photos, idx) {
            lbPhotos = photos; lbIdx = idx; lbShow();
            document.getElementById('lb-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function lbShow() {
            document.getElementById('lb-img').src = lbPhotos[lbIdx];
            document.getElementById('lb-caption').textContent = lbPhotos.length > 1 ? (lbIdx + 1) + ' / ' + lbPhotos.length : '';
        }
        function lbChange(dir) { lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length; lbShow(); }
        function lbClose() {
            document.getElementById('lb-overlay').classList.remove('active');
            document.getElementById('lb-img').src = '';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => {
            if (!document.getElementById('lb-overlay').classList.contains('active')) return;
            if (e.key === 'ArrowLeft')  lbChange(-1);
            if (e.key === 'ArrowRight') lbChange(1);
            if (e.key === 'Escape')     lbClose();
        });

        // COMPARTIR
        async function shareHistoria() {
            const url  = window.location.href;
            const text = '📸 La Vieja Romareda — Archivo fotográfico de un estadio legendario';
            if (navigator.share) {
                try { await navigator.share({ title: 'La Vieja Romareda', text, url }); } catch(e) {}
            } else {
                await navigator.clipboard.writeText(url);
                alert('Enlace copiado al portapapeles');
            }
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            loadBanner();
            loadPhotos();
        });
    </script>

    <script src="header.js"></script>
</body>
</html>
