    <style>
        :root {
            --blue: #00529F;
            --light: #4DA9FF;
            --text: #1a1a1a;
            --muted: #6b7280;
            --bg: #f9fafb;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); }

        /* TOP BAR */
        .top-bar {
            background:var(--blue); padding:14px 5%;
            display:flex; align-items:center; justify-content:space-between;
            position:sticky; top:0; z-index:100;
            box-shadow:0 4px 15px rgba(0,0,0,.2);
        }
        .top-bar-logo {
            font-family:'Calibri','Segoe UI',sans-serif;
            font-weight:700; font-style:italic;
            font-size:1.4rem; color:white; text-decoration:none;
        }
        .top-bar-logo:hover { color:var(--light); }
        .back-link {
            display:flex; align-items:center; gap:8px;
            color:rgba(255,255,255,.7); font-size:.9rem;
            text-decoration:none; transition:color .2s;
        }
        .back-link:hover { color:white; }

        /* HERO */
        .hero {
            background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.7)),
                        url('https://www.heraldo.es/uploads/imagenes/2019/08/28/_P924010_f6390c26.jpg');
            background-size:cover; background-position:center;
            padding:5rem 10%;
            color:white; text-align:center;
        }
        .hero-badge {
            display:inline-block; background:rgba(255,255,255,.15);
            border:1px solid rgba(255,255,255,.3);
            color:white; font-size:.78rem; font-weight:700;
            text-transform:uppercase; letter-spacing:2px;
            padding:5px 16px; border-radius:20px; margin-bottom:1.2rem;
        }
        .hero h1 {
            font-size:3rem; font-weight:900; color:white;
            margin-bottom:1rem; line-height:1.1;
        }
        .hero p {
            font-size:1.1rem; color:rgba(255,255,255,.75);
            max-width:600px; margin:0 auto 2rem; line-height:1.65;
        }
        .hero-stats {
            display:flex; justify-content:center; gap:2.5rem; flex-wrap:wrap;
        }
        .hero-stat { text-align:center; }
        .hero-stat-num {
            font-size:1.8rem; font-weight:900; color:var(--light); display:block;
        }
        .hero-stat-label {
            font-size:.78rem; color:rgba(255,255,255,.55);
            text-transform:uppercase; letter-spacing:1px;
        }


        /* LIGHTBOX */
        #lb-overlay {
            overscroll-behavior: contain;
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.96);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #lb-overlay.active { display: flex; }
        #lb-img {
            max-width: 90vw; max-height: 85vh;
            object-fit: contain; border-radius: 4px;
            user-select: none;
        }
        #lb-caption {
            color: rgba(255,255,255,0.5); font-size: 0.85rem;
            margin-top: 12px; font-family: 'Inter', sans-serif;
        }
        #lb-close {
            position: fixed; top: 20px; right: 28px;
            color: white; font-size: 2.5rem; cursor: pointer;
            background: none; border: none; line-height: 1; z-index: 100000;
        }
        #lb-close:hover { color: #4DA9FF; }
        #lb-prev, #lb-next {
            position: fixed; top: 50%; transform: translateY(-50%);
            color: white; font-size: 2rem; cursor: pointer;
            background: rgba(255,255,255,0.1); border: none;
            padding: 16px 14px; transition: background 0.2s; z-index: 100000;
        }
        #lb-prev { left: 0; border-radius: 0 6px 6px 0; }
        #lb-next { right: 0; border-radius: 6px 0 0 6px; }
        #lb-prev:hover, #lb-next:hover { background: rgba(255,255,255,0.25); }

        /* GALERÍA MASONRY */
        .gallery-section { padding:4rem 5%; max-width:1400px; margin:0 auto; }

        .gallery-filters {
            display:flex; align-items:center; gap:12px;
            margin-bottom:2rem; flex-wrap:wrap;
        }
        .gallery-count {
            font-size:.88rem; color:var(--muted);
            margin-left:auto;
        }

        /* Masonry con CSS columns */
        .masonry {
            columns:4; column-gap:12px;
        }
        .masonry-item {
            break-inside:avoid; margin-bottom:12px;
            border-radius:10px; overflow:hidden;
            cursor:pointer; position:relative;
            background:#e5e7eb;
        }
        .masonry-item img {
            width:100%; display:block;
            transition:transform .4s ease, filter .3s;
        }
        .masonry-item:hover img {
            transform:scale(1.04); filter:brightness(.85);
        }
        .masonry-item .overlay {
            position:absolute; inset:0;
            background:linear-gradient(transparent 50%, rgba(0,0,0,.7));
            opacity:0; transition:opacity .3s;
            display:flex; align-items:flex-end; padding:12px;
        }
        .masonry-item:hover .overlay { opacity:1; }
        .masonry-item .overlay span {
            color:white; font-size:.78rem; font-weight:600;
            line-height:1.3;
        }

        /* Skeleton masonry */
        .masonry-skeleton {
            break-inside:avoid; margin-bottom:12px;
            border-radius:10px; overflow:hidden;
            background:linear-gradient(90deg,#e5e7eb 25%,#d1d5db 50%,#e5e7eb 75%);
            background-size:200% 100%;
            animation:shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* CARGAR MÁS */
        .load-more-wrap { text-align:center; padding:2rem 0; }
        .load-more-btn {
            padding:12px 36px; background:var(--blue); color:white;
            border:none; border-radius:30px; font-size:.9rem; font-weight:700;
            font-family:'Inter',sans-serif; cursor:pointer; transition: color .3s, background .3s, transform .3s, opacity .3s, border-color .3s;
        }
        .load-more-btn:hover { background:#0063bf; transform:translateY(-2px); }
        .load-more-btn:disabled { background:#e5e7eb; color:var(--muted); transform:none; cursor:not-allowed; }

        
        #lb-caption {
            color:rgba(255,255,255,.6); font-size:.85rem;
            margin-top:12px; text-align:center;
        }

        /* COMPARTIR */
        .share-fab {
            position:fixed; bottom:2rem; right:2rem;
            width:52px; height:52px; border-radius:50%;
            background:var(--blue); color:white; border:none;
            font-size:1.2rem; cursor:pointer;
            box-shadow:0 8px 25px rgba(0,82,159,.4);
            display:flex; align-items:center; justify-content:center;
            transition:transform .2s, box-shadow .2s;
            z-index:500;
        }
        .share-fab:hover { transform:scale(1.1); box-shadow:0 12px 30px rgba(0,82,159,.5); }

        /* RESPONSIVE */
        @media(max-width:1024px) { .masonry { columns:3; } }
        @media(max-width:680px) {
            .masonry { columns:2; }
            .hero h1 { font-size:2rem; }
            .hero { padding:3rem 5%; }
        }
        @media(max-width:400px) { .masonry { columns:1; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        button, a, [role="button"] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, h4, .section-title, #banner-title, .week-title, .hero h1 {
            text-wrap: balance;
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = 'https://vakpbedvlvxzybxqival.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZha3BiZWR2bHZ4enlieHFpdmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDUzNDEsImV4cCI6MjEwMjUyMTM0MX0.fCZyl9nMGrqtNEHSLx8pZEeFPL4jzzzSKKHtTYQqrw0';
        const BUCKET       = 'historia';
        const PAGE_SIZE    = 24;

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allFiles    = [];
        let shown       = 0;
        let lbIndex     = 0;

        // ============================================
        // CARGA DE FOTOS
        // ============================================
        async function loadPhotos() {
            const { data, error } = await sb.storage
                .from(BUCKET)
                .list('', { limit:1000, sortBy:{ column:'created_at', order:'desc' } });

            if (error || !data) {
                document.getElementById('masonry').innerHTML =
                    '<p style="color:var(--muted); text-align:center; padding:2rem;">No hay fotos todavía.</p>';
                return;
            }

            allFiles = data.filter(f => f.name !== '.emptyFolderPlaceholder');

            // Stats
            const statEl = document.getElementById('stat-photos');
            if (statEl) statEl.textContent = allFiles.length;
            const countEl = document.getElementById('gallery-count');
            if (countEl) countEl.textContent = `${allFiles.length} foto${allFiles.length !== 1 ? 's' : ''}`;

            // Render primera página
            document.getElementById('masonry').innerHTML = '';
            shown = 0;
            renderBatch();
        }

        function getUrl(name) {
            const { data } = sb.storage.from(BUCKET).getPublicUrl(name);
            return data.publicUrl;
        }

        function renderBatch() {
            const masonry = document.getElementById('masonry');
            const batch   = allFiles.slice(shown, shown + PAGE_SIZE);

            batch.forEach((f, i) => {
                const url  = getUrl(f.name);
                const idx  = shown + i;
                const item = document.createElement('div');
                item.className = 'masonry-item';
                item.onclick   = () => lbOpen(allFiles.map(f => getUrl(f.name)), idx);
                item.innerHTML = `
                    <img src="${url}" alt="La Vieja Romareda" loading="lazy">
                    <div class="overlay">
                        <span>${f.name.replace(/^\d+_/, '').replace(/\.[^.]+$/, '')}</span>
                    </div>`;
                masonry.appendChild(item);
            });

            shown += batch.length;

            // Botón cargar más
            const wrap = document.getElementById('load-more-wrap');
            const btn  = document.getElementById('load-more-btn');
            if (shown < allFiles.length) {
                wrap.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-chevron-down" aria-hidden="true"></i> Cargar más fotos (${allFiles.length - shown} restantes)`;
            } else {
                wrap.style.display = 'none';
            }
        }

        function loadMore() {
            document.getElementById('load-more-btn').disabled = true;
            renderBatch();
        }

        // ============================================
        // LIGHTBOX
        // ============================================


        // LIGHTBOX
        let lbPhotos = [], lbIdx = 0;
        function lbOpen(photos, idx) {
            lbPhotos = photos; lbIdx = idx; lbShow();
            document.getElementById('lb-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function lbShow() {
            document.getElementById('lb-img').src = lbPhotos[lbIdx];
            document.getElementById('lb-caption').textContent =
                lbPhotos.length > 1 ? (lbIdx + 1) + ' / ' + lbPhotos.length : '';
        }
        function lbChange(dir) {
            lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length;
            lbShow();
        }
        function lbClose() {
            document.getElementById('lb-overlay').classList.remove('active');
            document.getElementById('lb-img').src = '';
            document.body.style.overflow = '';
        }
        function lbClickOutside(e) {
            if (e.target === document.getElementById('lb-overlay')) lbClose();
        }
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lb-overlay').classList.contains('active')) return;
            if (e.key === 'ArrowLeft')  lbChange(-1);
            if (e.key === 'ArrowRight') lbChange(1);
            if (e.key === 'Escape')     lbClose();
        });

        // ============================================
        // COMPARTIR
        // ============================================
        async function shareHistoria() {
            const url  = window.location.href;
            const text = '📸 La Vieja Romareda — Archivo fotográfico de un estadio legendario';
            if (navigator.share) {
                try { await navigator.share({ title: 'La Vieja Romareda', text, url }); }
                catch(e) {}
            } else {
                await navigator.clipboard.writeText(url);
                alert('Enlace copiado al portapapeles');
            }
        }

        // ============================================
        // INIT
        // ============================================

        async function loadBannerDynamic(pagina, defaultBg) {
            const bg  = document.getElementById('banner-bg');
            const h1  = document.getElementById('banner-title');
            const sub = document.getElementById('banner-subtitle');
            // Set default background
            if (bg && defaultBg) bg.style.backgroundImage = `url('${defaultBg}')`;
            try {
                const { data } = await sb.from('banners').select('*').eq('pagina', pagina).limit(1);
                const row = data && data.length > 0 ? data[0] : null;
                if (!row) return;
                if (bg  && row.foto_url) bg.style.backgroundImage = `url('${row.foto_url}')`;
                if (h1  && row.titulo)   h1.textContent  = row.titulo;
                if (sub && row.subtexto) sub.textContent = row.subtexto;
            } catch(e) { console.warn('Banner load error:', e); }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadBannerDynamic('historia', 'https://www.heraldo.es/uploads/imagenes/2019/08/28/_P924010_f6390c26.jpg');
            loadPhotos();
        });


    </script>
    <!-- LIGHTBOX -->
    <div id="lb-overlay" onclick="lbClickOutside(event)">
        <button id="lb-close" onclick="lbClose()">&#x2715;</button>
        <button id="lb-prev" onclick="lbChange(-1)">&#10094;</button>
        <img id="lb-img" src="" alt="">
        <div id="lb-caption"></div>
        <button id="lb-next" onclick="lbChange(1)">&#10095;</button>
    </div>

</body>
</html>
