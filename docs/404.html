<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00529F">
    <title>Página no encontrada · Obras Romareda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@1,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --blue: #00529F; --light: #4DA9FF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scrollbar-gutter: stable; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
            background: var(--blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            color: white;
        }
        .error-number {
            font-size: clamp(5rem, 20vw, 10rem);
            font-weight: 800;
            line-height: 1;
            color: rgba(255,255,255,0.12);
            margin-bottom: -1rem;
            letter-spacing: -0.05em;
        }
        .crane-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            display: block;
            animation: sway 3s ease-in-out infinite;
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-4deg); }
            50%       { transform: rotate(4deg); }
        }
        @media (prefers-reduced-motion: reduce) { .crane-icon { animation: none; } }
        h1 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: var(--blue);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px 32px;
            border-radius: 100px;
            text-decoration: none;
            transition: transform 160ms cubic-bezier(0.23,1,0.32,1), box-shadow 160ms cubic-bezier(0.23,1,0.32,1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        @media (hover: hover) and (pointer: fine) {
            .btn-home:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,0.25); }
        }
        .btn-home:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <main>
        <div class="error-number">404</div>
        <span class="crane-icon" aria-hidden="true">🏗️</span>
        <h1>Página no encontrada</h1>
        <p>Esta página está en obras o no existe. Vuelve a la portada para seguir el avance de la nueva Romareda.</p>
        <a href="index.html" class="btn-home">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
            Volver al inicio
        </a>
    </main>

    <script src="header.js"></script>
</body>
</html>
