<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00529F">
    <title>Especiales · Obras Romareda</title>
    <meta name="description" content="Momentos destacados de las obras de la nueva Romareda: desmontajes, visitas oficiales e hitos especiales.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Carlito:ital,wght@1,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --blue:#00529F; --light:#4DA9FF; --text:#1a1a1a; --muted:#6b7280; --bg:#f9fafb; --ease-out:cubic-bezier(.23,1,.32,1); }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scrollbar-gutter: stable; }
        body { font-family:'Barlow',sans-serif; color:var(--text); background:var(--bg); }
        h1,h2 { text-wrap:balance; font-optical-sizing:auto; }
        button, a, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        .page-header { background:var(--blue); padding:4rem 10% 3rem; text-align:center; color:#fff; }
        .page-header h1 { font-size:clamp(1.8rem,4vw,2.6rem); font-weight:800; letter-spacing:-0.025em; margin-bottom:.6rem; }
        .page-header p  { font-size:1rem; color:rgba(255,255,255,.75); max-width:560px; margin:0 auto; }

        .esp-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:24px; padding:3rem 10% 5rem; max-width:1200px; margin:0 auto;
        }
        .esp-card {
            display:block; text-decoration:none; color:inherit;
            border-radius:16px; overflow:hidden; background:#fff;
            border:0.5px solid #e5e7eb;
            transition:transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
        }
        @media (hover:hover) and (pointer:fine) {
            .esp-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(0,0,0,.1); }
        }
        .esp-card-img-wrap { position:relative; aspect-ratio:16/10; background:var(--blue); overflow:hidden; }
        .esp-card-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; transition:transform 300ms var(--ease-out); }
        @media (hover:hover) and (pointer:fine) { .esp-card:hover .esp-card-img-wrap img { transform:scale(1.05); } }
        .esp-card-badge {
            position:absolute; top:12px; left:12px;
            background:rgba(255,255,255,.92); color:var(--blue);
            font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
            padding:4px 12px; border-radius:100px;
        }
        .esp-card-body { padding:16px 18px; }
        .esp-card-date  { font-size:.78rem; color:var(--muted); margin-bottom:4px; }
        .esp-card-title { font-size:1.05rem; font-weight:700; color:var(--blue); line-height:1.3; }

        .esp-empty { text-align:center; padding:5rem 10%; color:var(--muted); grid-column:1/-1; }
        .esp-empty i { font-size:2.5rem; display:block; margin-bottom:1rem; opacity:.4; }

        .esp-skeleton { aspect-ratio:16/10; background:linear-gradient(90deg,#eef1f5 25%,#e5e9ef 50%,#eef1f5 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:16px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        footer { background:var(--blue); color:#fff; padding:4rem 10%; text-align:center; border-top:8px solid var(--light); }
        .footer-links { display:flex; justify-content:center; gap:2rem; margin-bottom:20px; }
        .footer-links a { color:#fff; font-size:1.5rem; }

        @media (prefers-reduced-motion:reduce) { .esp-card, .esp-card-img-wrap img, .esp-skeleton { transition:none; animation:none; } }
    </style>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="alumni.css">
</head>
<body>

    <div class="page-header">
        <h1>Especiales</h1>
        <p>Desmontajes, visitas oficiales e hitos destacados de las obras, fuera del repaso semana a semana.</p>
    </div>

    <div class="esp-grid" id="esp-grid">
        <div class="esp-skeleton"></div>
        <div class="esp-skeleton"></div>
        <div class="esp-skeleton"></div>
    </div>

    <footer>
        <div class="logo" style="margin-bottom:20px;color:white;font-family:'Calibri','Carlito',sans-serif;font-weight:700;font-style:italic;font-size:1.8rem;">@ObrasRomareda</div>
        <div class="footer-links">
            <a href="https://twitter.com/ObrasRomareda" target="_blank" rel="noopener noreferrer" aria-label="Twitter de ObrasRomareda"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>
            <a href="https://instagram.com/ObrasRomareda" target="_blank" rel="noopener noreferrer" aria-label="Instagram de ObrasRomareda"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
            <a href="https://youtube.com/@ObrasRomareda" target="_blank" rel="noopener noreferrer" aria-label="YouTube de ObrasRomareda"><i class="fa-brands fa-youtube" aria-hidden="true"></i></a>
        </div>
        <p>Web no oficial · Renders e imágenes técnicas: IDOM</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://vakpbedvlvxzybxqival.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZha3BiZWR2bHZ4enlieHFpdmFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDUzNDEsImV4cCI6MjEwMjUyMTM0MX0.fCZyl9nMGrqtNEHSLx8pZEeFPL4jzzzSKKHtTYQqrw0';
        const BUCKET = 'especiales';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Escapa texto antes de insertarlo como HTML
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str == null ? '' : String(str);
            return d.innerHTML;
        }
        function fmtFecha(f) {
            if (!f) return '';
            const d = new Date(f + 'T00:00:00');
            return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        async function load() {
            const grid = document.getElementById('esp-grid');
            const { data, error } = await sb.from('especiales').select('slug,titulo,fecha,portada_url,banner_url').order('fecha', { ascending: false });
            if (error || !data) {
                grid.innerHTML = '<div class="esp-empty"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i>No se pudieron cargar los especiales.</div>';
                return;
            }
            if (!data.length) {
                grid.innerHTML = '<div class="esp-empty"><i class="fas fa-star" aria-hidden="true"></i>Todavía no hay momentos especiales publicados.</div>';
                return;
            }
            grid.innerHTML = data.map(e => {
                const img = e.banner_url || e.portada_url;
                return `<a class="esp-card" href="especial.html?s=${encodeURIComponent(e.slug)}">
                    <div class="esp-card-img-wrap">
                        ${img ? `<img src="${esc(img)}" alt="${esc(e.titulo)}" loading="lazy">` : ''}
                        <span class="esp-card-badge">★ Especial</span>
                    </div>
                    <div class="esp-card-body">
                        ${e.fecha ? `<div class="esp-card-date">${fmtFecha(e.fecha)}</div>` : ''}
                        <div class="esp-card-title">${esc(e.titulo)}</div>
                    </div>
                </a>`;
            }).join('');
        }
        load();
    </script>
    <script src="header.js"></script>
</body>
</html>
