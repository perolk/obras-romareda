        // --- LÓGICA COMPARADOR ---
        function initComparisons() {
            var x, i;

            for (i = 0; i < x.length; i++) {
                compareImages(x[i]);

            }
            function compareImages(img) {
                var slider, clicked = 0, w, h;
                w = img.offsetWidth;
                h = img.offsetHeight;
                img.style.width = (w / 2) + "px";
                slider = document.createElement("DIV");
                slider.setAttribute("class", "img-comp-slider");
                img.parentElement.insertBefore(slider, img);
                slider.style.top = (h / 2) - (slider.offsetHeight / 2) + "px";
                slider.style.left = (w / 2) - (slider.offsetWidth / 2) + "px";
                slider.addEventListener("mousedown", slideReady);
                window.addEventListener("mouseup", slideFinish);
                slider.addEventListener("touchstart", slideReady);
                window.addEventListener("touchend", slideFinish);
                                                function getCursorPos(e) {
                    var a, x = 0;
                    e = (e.changedTouches) ? e.changedTouches[0] : e;
                    a = img.getBoundingClientRect();
                    x = e.pageX - a.left;
                    x = x - window.pageXOffset;
                    return x;
                }
                function slide(x) {
                    img.style.width = x + "px";
                    slider.style.left = img.offsetWidth - (slider.offsetWidth / 2) + "px";

                function showSlide() {
            const img = document.getElementById('img01');
            const caption = document.getElementById('caption');
            const photo = currentPhotos[currentIndex];
            img.src = photo.src;
            img.alt = photo.desc;
            if (currentPhotos.length > 1) {
                caption.innerHTML = `${photo.desc} <br> <span style="font-size:0.8em; color:#999;">(${currentIndex + 1} / ${currentPhotos.length})</span>`;
                document.querySelector('.prev').style.display = "block";
                document.querySelector('.next').style.display = "block";
            } else {
                caption.innerHTML = photo.desc;
                document.querySelector('.prev').style.display = "none";
                document.querySelector('.next').style.display = "none";
            }
        }

        function changeSlide(n) {
            currentIndex += n;
            if (currentIndex >= currentPhotos.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentPhotos.length - 1;
            showSlide();
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        document.addEventListener('keydown', function(event) {
            if (document.getElementById('imageModal').style.display === "flex") {
                if (event.key === "ArrowLeft") changeSlide(-1);
                if (event.key === "ArrowRight") changeSlide(1);
                if (event.key === "Escape") closeModal();
            }
            if (event.key === "Escape") {
                closeArchiveModal();
                closeAlbumModal();
            }
        });

        // Smooth scroll para enlaces internos

        // SLIDESHOW HERO
        (function() {
            const slides = document.querySelectorAll('.hero-slide');
            const dotsContainer = document.getElementById('heroDots');
            let current = 0;
            let timer;

            // Crear dots
            slides.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
                dot.setAttribute('aria-label', `Imagen ${i + 1}`);
                dot.addEventListener('click', () => goTo(i));
                dotsContainer.appendChild(dot);
            });

            function goTo(idx) {
                slides[current].classList.remove('active');
                dotsContainer.children[current].classList.remove('active');
                current = (idx + slides.length) % slides.length;
                slides[current].classList.add('active');
                dotsContainer.children[current].classList.add('active');
            }

            function next() { goTo(current + 1); }

            function start() { timer = setInterval(next, 7000); }
            function stop()  { clearInterval(timer); }

            // Pausar al hover
            const hero = document.querySelector('.hero');
            hero.addEventListener('mouseenter', stop);
            hero.addEventListener('mouseleave', start);

            // Pausar si pefers-reduced-motion
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                start();
            }
        })();

        // 3. ANIMACIONES DE ENTRADA AL HACER SCROLL
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    fadeObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

        document.querySelectorAll('.fade-in').forEach(el => fadeObserver.observe(el));

        // Smooth scroll para enlaces internos
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) target.scrollIntoView({ behavior: 'smooth' });

        });
